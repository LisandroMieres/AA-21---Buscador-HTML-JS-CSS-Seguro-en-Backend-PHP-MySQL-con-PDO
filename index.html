<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 2rem; background: #f4f6f8; color: #222; }
        h1 { margin-top: 0; }
        .contenedor { max-width: 1000px; margin: auto; }
        form {
            background: #fff; padding: 1rem; border-radius: 8px;
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: .75rem; margin-bottom: 1.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
        }
        form h2 { grid-column: 1 / -1; margin: 0 0 .5rem; font-size: 1.1rem; }
        label { display: flex; flex-direction: column; font-size: .85rem; gap: .25rem; }
        input, button {
            padding: .55rem; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: .95rem;
        }
        button {
            cursor: pointer; background: #2563eb; color: #fff; border: none;
            font-weight: 600; transition: background .2s;
        }
        button:hover { background: #1e40af; }
        .acciones-form { grid-column: 1 / -1; display: flex; gap: .5rem; }
        .acciones-form button { flex: 1; }
        .btn-cancelar { background: #6b7280; }
        .btn-cancelar:hover { background: #4b5563; }
        .buscar { margin-bottom: 1rem; display: flex; gap: .5rem; }
        .buscar input { flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #fff;
                border-radius: 8px; overflow: hidden;
                box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        th, td { padding: .7rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #1e293b; color: #fff; font-size: .85rem;
             text-transform: uppercase; letter-spacing: .5px; }
        tr:last-child td { border-bottom: none; }
        .acciones button { padding: .35rem .7rem; font-size: .8rem; margin-right: .35rem; }
        .btn-eliminar { background: #dc2626; }
        .btn-eliminar:hover { background: #991b1b; }
        .btn-editar { background: #059669; }
        .btn-editar:hover { background: #065f46; }
        #mensaje {
            margin-bottom: 1rem; padding: .75rem 1rem; border-radius: 6px;
            display: none; font-weight: 500;
        }
        #mensaje.ok { background: #d1fae5; color: #065f46; display: block; }
        #mensaje.error { background: #fee2e2; color: #991b1b; display: block; }
        .error-campo { color: #dc2626; font-size: .75rem; min-height: 1em; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Gestión de Productos</h1>

    <div id="mensaje"></div>

    <form id="form-producto" novalidate>
        <h2 id="titulo-form">Nuevo producto</h2>
        <input type="hidden" id="id" name="id">

        <label>
            Nombre
            <input type="text" id="nombre" name="nombre" maxlength="100" required>
            <span class="error-campo" data-error="nombre"></span>
        </label>

        <label>
            Categoría
            <input type="text" id="categoria" name="categoria" maxlength="50" required>
            <span class="error-campo" data-error="categoria"></span>
        </label>

        <label>
            Precio
            <input type="number" id="precio" name="precio" step="0.01" min="0" required>
            <span class="error-campo" data-error="precio"></span>
        </label>

        <label>
            Stock
            <input type="number" id="stock" name="stock" step="1" min="0" required>
            <span class="error-campo" data-error="stock"></span>
        </label>

        <div class="acciones-form">
            <button type="submit" id="btn-guardar">Guardar</button>
            <button type="button" class="btn-cancelar" id="btn-cancelar" hidden>Cancelar</button>
        </div>
    </form>

    <div class="buscar">
        <input type="text" id="input-buscar" placeholder="Buscar por nombre o categoría...">
        <button type="button" id="btn-buscar">Buscar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-productos">
            <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
    </table>
</div>

<script src="js/app.js"></script>
</body>
</html>
